name: Substack Pipeline

on:
  push:
    paths:
      - 'content/substack/**'

jobs:
  publish-substack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y || true
          npm install playwright

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Publish to Substack
        env:
          SUBSTACK_SESSION: ${{ secrets.SUBSTACK_SESSION }}
          SUBSTACK_CF_CLEARANCE: ${{ secrets.SUBSTACK_CF_CLEARANCE }}
        run: |
          node scripts/publish_substack_playwright.js content/substack/001.json
