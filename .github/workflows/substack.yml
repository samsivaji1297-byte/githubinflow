name: Substack Auto Publisher

on:
  push:
    paths:
      - 'content/substack/**'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r substack_api/requirements.txt

      - name: Convert JSON to markup
        run: |
          python convert_json_to_markup.py content/substack/001.json > markup.txt

      - name: Create draft
        env:
          PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
          USER_ID: ${{ secrets.SUBSTACK_USER_ID }}
          SUBSTACK_SID: ${{ secrets.SUBSTACK_SUBSTACK_SID }}
          SUBSTACK_LILI: ${{ secrets.SUBSTACK_SUBSTACK_LILI }}
        run: |
          python substack_api/draft_create.py markup.txt

      - name: Publish draft
        env:
          PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
          USER_ID: ${{ secrets.SUBSTACK_USER_ID }}
          SUBSTACK_SID: ${{ secrets.SUBSTACK_SUBSTACK_SID }}
          SUBSTACK_LILI: ${{ secrets.SUBSTACK_SUBSTACK_LILI }}
        run: |
          python substack_api/draft_publish.py
